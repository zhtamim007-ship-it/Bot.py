name: Private Windows Session

on:
  workflow_dispatch:

permissions:
  contents: read

# Only one run executes at a time.
# Additional requests can remain pending.
concurrency:
  group: private-windows-session
  cancel-in-progress: false

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Validate settings
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          CLIENT_IP: ${{ secrets.TAILSCALE_CLIENT_IP }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($name in @(
              "TS_AUTH_KEY",
              "BOT_TOKEN",
              "OWNER_ID",
              "CLIENT_IP"
          )) {
              $value = [Environment]::GetEnvironmentVariable($name)

              if ([string]::IsNullOrWhiteSpace($value)) {
                  throw "Missing required setting: $name"
              }
          }

          if ($env:OWNER_ID -notmatch '^[1-9][0-9]*$') {
              throw "OWNER_TELEGRAM_ID must be your positive numeric user ID."
          }

          $ip = $null
          if (-not [System.Net.IPAddress]::TryParse(
              $env:CLIENT_IP,
              [ref]$ip
          )) {
              throw "TAILSCALE_CLIENT_IP must be one IPv4 address."
          }

          if ($ip.AddressFamily -ne
              [System.Net.Sockets.AddressFamily]::InterNetwork) {
              throw "Use the phone's Tailscale IPv4 address."
          }

          $bytes = $ip.GetAddressBytes()
          if (
              $bytes[0] -ne 100 -or
              $bytes[1] -lt 64 -or
              $bytes[1] -gt 127
          ) {
              throw "Expected a Tailscale IPv4 address in 100.64.0.0/10."
          }

          # Leave time for cleanup before the job timeout.
          $end = [DateTimeOffset]::UtcNow.AddMinutes(350)
          "SESSION_END=$($end.ToString('o'))" |
              Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Tailscale
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:TEMP "tailscale.msi"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid") {
              throw "Installer signature validation failed."
          }

          $process = Start-Process msiexec.exe `
              -ArgumentList "/i `"$installer`" /quiet /norestart" `
              -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed."
          }

          Remove-Item $installer -Force

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
              throw "Tailscale executable not found."
          }

      - name: Connect to your Tailscale network
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
              "--auth-key=$env:TS_AUTH_KEY" `
              "--hostname=private-win-$env:GITHUB_RUN_ID" `
              "--timeout=60s"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale enrollment failed. Check the key and device approval."
          }

          $ready = $false

          for ($i = 0; $i -lt 12; $i++) {
              $raw = & $ts status --json

              if ($LASTEXITCODE -eq 0) {
                  $status = $raw | ConvertFrom-Json

                  if ($status.BackendState -eq "Running") {
                      $ready = $true
                      break
                  }
              }

              Start-Sleep -Seconds 5
          }

          if (-not $ready) {
              throw "Tailscale is not ready. Check device approval."
          }

          $output = & $ts ip -4
          if ($LASTEXITCODE -ne 0) {
              throw "Could not retrieve the Tailscale IP."
          }

          $address = $output | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($address)) {
              throw "Tailscale returned no IPv4 address."
          }

          "TAILSCALE_IP=$($address.Trim())" |
              Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create a non-administrator RDP user
        run: |
          $ErrorActionPreference = "Stop"

